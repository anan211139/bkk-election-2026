# Cache headers for the Bangkok Election static build.
#
# Usage:
#   1. Serve the repository's ./build directory as the Nginx root.
#   2. Include this file inside the matching server block.
#   3. Keep Cloudflare Cache Rules enabled on top of these origin headers.

error_page 404 /candidate/404.html;
error_page 500 502 503 504 /candidate/500.html;

# Fingerprinted JS/CSS/images/fonts can be cached for a long time.
location ^~ /map/assets/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

location ^~ /_next/static/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

location ^~ /ui/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

location ^~ /static/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  try_files $uri =404;
}

# Live result JSON should revalidate in the browser, while remaining briefly cacheable at the edge.
location ~ ^/(map/data|results|media-api)/.+\.json$ {
  add_header Cache-Control "public, max-age=0, s-maxage=30, stale-while-revalidate=30" always;
  try_files $uri =404;
}

# Static pages can be cached at the edge. Keep browser TTL modest for emergency edits.
location = /about {
  add_header Cache-Control "public, max-age=300, s-maxage=1800, stale-while-revalidate=86400" always;
  try_files /about.html /about/index.html =404;
}

location = /map/map {
  add_header Cache-Control "public, max-age=300, s-maxage=1800, stale-while-revalidate=86400" always;
  try_files /map/map.html /map/map/index.html =404;
}

location = /map/slideshow {
  add_header Cache-Control "public, max-age=300, s-maxage=1800, stale-while-revalidate=86400" always;
  try_files /map/slideshow.html /map/slideshow/index.html =404;
}

location ^~ /candidate/ {
  add_header Cache-Control "public, max-age=300, s-maxage=1800, stale-while-revalidate=86400" always;
  try_files $uri $uri.html $uri/index.html /candidate/404.html;
}
